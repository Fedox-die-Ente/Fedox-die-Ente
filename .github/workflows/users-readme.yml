name: Update README with Latest Users

on:
  issues:
    types: [opened]

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Process Issue
      id: issue_data
      run: |
        # Initial Reaction
        curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
          -d '{"content":"eyes"}'

        # Setup Variables
        echo "USER_NAME=${{ github.actor }}" >> $GITHUB_ENV
        echo "USER_DATE=$(date +"%Y-%m-%d")" >> $GITHUB_ENV
        
        if [[ "${{ github.event.issue.title }}" == "Submit yourself" ]]; then
          echo "valid_issue=true" >> $GITHUB_ENV
        else
          echo "valid_issue=false" >> $GITHUB_ENV
        fi

    - name: Update README
      if: env.valid_issue == 'true'
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"

        # Prüfen auf Duplikate (via Username im Badge-Link)
        if grep -q "badge/${{ env.USER_NAME }}-" README.md; then
          echo "User exists. Skipping."
          exit 0
        fi

        python3 - <<EOF
        import re

        # Datei einlesen
        with open('README.md', 'r', encoding='utf-8') as f:
            content = f.read()

        # Extrahiere aktuelle User-Zellen aus der START_SECTION
        users_match = re.search(r'(.*?)', content, re.DOTALL)
        if users_match:
            # Findet alle vorhandenen <td> Blöcke
            cells = re.findall(r'<td align="center">.*?</td>', users_match.group(1), re.DOTALL)
            
            # Neue Zelle für den aktuellen User bauen
            new_cell = """    <td align="center">
            <a href="https://github.com/${{ env.USER_NAME }}">
              <img src="https://avatars.githubusercontent.com/${{ env.USER_NAME }}" width="50" style="border-radius:50%;" /><br />
              <img src="https://img.shields.io/badge/${{ env.USER_NAME }}-${{ env.USER_DATE }}-601FDE?style=flat" />
            </a>
          </td>"""
            
            # Neuen User an den Anfang der Liste setzen
            cells.insert(0, new_cell)

            # Alles was über 3 User hinausgeht, wird für "Past Legends" zwischengespeichert
            shifted_user = None
            if len(cells) > 3:
                shifted_user = cells.pop()

            # Den neuen Block für "The Chosen Ones" zusammenbauen
            new_users_html = '\n<table>\n  <tr>\n' + '\n'.join(cells) + '\n  </tr>\n</table>\n'
            content = re.sub(r'.*?', new_users_html, content, flags=re.DOTALL)

            # Falls jemand rausgefallen ist, in die Past Legends Tabelle schieben
            if shifted_user:
                # Bildgröße für die History etwas verkleinern (von 50 auf 40)
                shifted_user = shifted_user.replace('width="50"', 'width="40"')
                
                old_match = re.search(r'(.*?)', content, re.DOTALL)
                if old_match:
                    old_content_inner = old_match.group(1)
                    # Wir fügen die Zelle nach dem ersten <tr> der alten Tabelle ein
                    updated_old_inner = re.sub(r'<tr>', '<tr>\n' + shifted_user, old_content_inner, count=1)
                    content = content.replace(old_content_inner, updated_old_inner)

        # Datei mit den Änderungen speichern
        with open('README.md', 'w', encoding='utf-8') as f:
            f.write(content)
        EOF

        git add README.md
        git commit -m "Welcome ${{ env.USER_NAME }} to the Hall of Fame!"
        git push

    - name: Close Issue
      if: always()
      run: |
        ISSUE_NUMBER=${{ github.event.issue.number }}
        if [[ "${{ env.valid_issue }}" == "true" ]]; then
          MSG="Welcome aboard! You've officially made it into the Hall of Fame 😎"
        else
          MSG="Oops! 😬 Please use the exact title 'Submit yourself' to be added."
        fi
        
        curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -d "{\"body\":\"$MSG\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"
        
        curl -X PATCH -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" \
          -d '{"state":"closed"}'